[tools]
bun = "1.4.2"
go = "1.25.1"

[tasks.install]
description = "Install JavaScript workspace dependencies"
run = "bun install"
raw_args = true

[tasks.dev]
description = "Start the API, web UI, and embedded workers against local Postgres"
run = "bun run --cwd web dev"
env = { _.file = ".env" }

[tasks."dev:server"]
description = "Start only the Hono API and embedded workers"
run = "bun run --cwd server dev"
env = { _.file = ".env" }

[tasks."dev:web"]
description = "Start only the Vite administration UI"
run = "bun run --cwd web vite"
env = { _.file = ".env" }

[tasks.start]
description = "Serve the built API and static UI"
run = "bun run --cwd server start"
env = { _.file = ".env" }

[tasks.build]
description = "Typecheck and build the administration UI"
run = ["mise run typecheck", "bun run --cwd web build"]

[tasks.test]
description = "Run unit tests"
run = "bun --env-file=.env test shared server workers tests scripts/publish-images.test.ts scripts/install-edge-auth.test.ts scripts/install-edge-l4.test.ts scripts/edge-namespace.test.ts"

[tasks."test:e2e"]
description = "Run fresh-volume browser onboarding against a disposable local database"
run = "bun --env-file=.env scripts/test-e2e.ts"

[tasks."test:upgrade"]
description = "Verify schema upgrade and startup nft policy activation (requires Docker)"
run = "bun --env-file=.env scripts/test-upgrade-migrations.ts"

[tasks."test:stalwart"]
description = "Run native mail lifecycle checks against a disposable pinned Stalwart container"
run = "env -u STALWART_URL -u STALWART_ADMIN_ADDRESS -u STALWART_ADMIN_PASSWORD bun scripts/test-stalwart-integration.ts"

[tasks."test:edge"]
description = "Check edge harness cleanup and pins, validate Caddy configurations, test edge behaviour, the public database port nftables rules, the LocalAPI deployment, route withdrawal and the HAProxy SNI router (edge-l4)"
run = [
  "bun test scripts/edge-test",
  "bun scripts/test-edge-config.ts",
  "bun scripts/test-db-ingress.ts",
  "bun scripts/test-edge-observer.ts",
  "bun scripts/test-edge-l4.ts",
]

[tasks."test:pgbouncer"]
description = "Start app-postgres and pgbouncer-public from the platform Compose file and test mTLS, SCRAM, admin-socket reloads and database clients (connect, read-only preview, revoke)"
run = "bun scripts/test-pgbouncer-public.ts"

[tasks."test:db-ingress"]
description = "Check the public database port nftables rules (per-source limits, /64 grouping, both hooks), their counters and alerts in a privileged container"
run = ["bun test shared/src/db-ingress.test.ts", "bun scripts/test-db-ingress.ts"]

[tasks."test:tailnet-acl"]
description = "Validate the generated Tailscale policy snippet against a scratch tailnet (skips without ARK_TEST_TS_POLICY_API_KEY)"
run = "bun scripts/test-tailnet-acl.ts"

[tasks."test:agent"]
description = "Run Docker agent policy tests"
run = "go test ./..."
dir = "agent"

[tasks."test:agent-integration"]
description = "Deploy, inspect, restart, and remove a pinned workload on a disposable Docker project"
run = "ARK_DOCKER_INTEGRATION=1 go test -run TestDisposableDockerDeploymentAndDurableLedger -count=1 ./..."
dir = "agent"

[tasks.typecheck]
description = "Typecheck every TypeScript workspace and the image publisher"
run = [
  "bunx tsc --noEmit -p shared/tsconfig.json",
  "bunx tsc --noEmit -p server/tsconfig.json",
  "bunx tsc --noEmit -p web/tsconfig.json",
  "bunx tsc --noEmit -p workers/tsconfig.json",
  "bunx tsc --noEmit -p scripts/tsconfig.publish.json",
]

[tasks.lint]
description = "Lint the repository with oxlint"
run = "bunx oxlint ."

[tasks."lint:fix"]
description = "Apply safe oxlint fixes"
run = "bunx oxlint --fix ."

[tasks.format]
description = "Format the repository with oxfmt"
run = "bunx oxfmt ."

[tasks."format:check"]
description = "Check oxfmt formatting"
run = "bunx oxfmt --check ."

[tasks.check]
description = "Format, lint, typecheck, and test"
run = ["mise run format:check", "mise run lint", "mise run typecheck", "mise run test"]

[tasks."db:up"]
description = "Start the local platform PostgreSQL instance"
run = "docker compose -f infra/platform/docker-compose.yml -f infra/platform/docker-compose.dev.yml up -d postgres app-postgres"

[tasks."db:down"]
description = "Stop local platform containers"
run = "docker compose -f infra/platform/docker-compose.yml -f infra/platform/docker-compose.dev.yml down"

[tasks."db:generate"]
description = "Generate Drizzle migrations from the server schema"
run = "bun run --cwd server db:generate"
env = { _.file = ".env" }

[tasks."db:migrate"]
description = "Apply Drizzle migrations to PostgreSQL"
run = "bun run --cwd server db:migrate"
env = { _.file = ".env" }

[tasks."db:studio"]
description = "Open Drizzle Studio"
run = "bun run --cwd server db:studio"
env = { _.file = ".env" }

[tasks.recover]
description = "Local recovery CLI for lockout and setup repair"
raw_args = true
run = "bun run --cwd server recover"
env = { _.file = ".env" }

[tasks."recover:mfa"]
description = "Deliberately reset owner MFA and revoke every session"
raw_args = true
run = "bun --env-file=.env scripts/recover-mfa.ts"

[tasks."agent:test"]
description = "Run Go agent tests"
run = "go test ./..."
dir = "agent"

[tasks."images:publish"]
description = "Build every platform image and push it to GHCR"
raw_args = true
run = "bun scripts/publish-images.ts"

[tasks."agent:build"]
description = "Build the Docker agent"
run = "go build -o ark-agent ."
dir = "agent"

[tasks.setup]
description = "Install tools and workspace dependencies"
run = ["mise install", "bun install"]

[tasks."host:install"]
description = "Generate host secrets, start Postgres, and apply migrations"
run = "bun scripts/install.ts"
env = { _.file = ".env" }

[tasks.import]
description = "Compare an Orkmail or PgStack inventory without importing owners"
raw_args = true
run = "bun --env-file=.env scripts/import.ts"

[tasks."recover-host"]
description = "Print the host-loss recovery checklist"
run = "bun --env-file=.env scripts/recover-host.ts"

[tasks."mail:up"]
description = "Start the Stalwart mail engine"
run = "docker compose -f infra/mail/docker-compose.yml up -d"

[tasks."monitor:up"]
description = "Start Prometheus with 14-day retention"
run = "docker compose -f infra/monitoring/docker-compose.yml up -d"

[tasks.maintain]
description = "Validate and optionally apply a platform maintenance bundle"
raw_args = true
run = "bun --env-file=.env scripts/maintain.ts"

[tasks."edge:rejoin"]
description = "Recreate edge and edge-l4 if edge-ts was restarted or replaced under it"
run = "bun --env-file=.env scripts/edge-namespace.ts"

[tasks."test:edge-tailnet"]
description = "Opt-in: join edge-ts to a real test tailnet and check tags, grants, shields-up and UDP 41642 (skips without ARK_TEST_TS_EDGE_AUTHKEY)"
run = "bun scripts/test-edge-tailnet.ts"
