[tools]
bun = "1.4.2"
go = "1.25.1"

[tasks.install]
description = "Install JavaScript workspace dependencies"
run = "bun install"
raw_args = true

[tasks.dev]
description = "Start the API, web UI, and embedded workers against local Postgres"
run = "bun run --cwd web dev"
env = { _.file = ".env" }

[tasks."dev:server"]
description = "Start only the Hono API and embedded workers"
run = "bun run --cwd server dev"
env = { _.file = ".env" }

[tasks."dev:web"]
description = "Start only the Vite administration UI"
run = "bun run --cwd web vite"
env = { _.file = ".env" }

[tasks.start]
description = "Serve the built API and static UI"
run = "bun run --cwd server start"
env = { _.file = ".env" }

[tasks.build]
description = "Typecheck and build the administration UI"
run = ["mise run typecheck", "bun run --cwd web build"]

[tasks.test]
description = "Run unit tests"
run = "bun --env-file=.env test shared server workers tests scripts/publish-images.test.ts scripts/install-edge-auth.test.ts scripts/install-edge-l4.test.ts scripts/edge-namespace.test.ts scripts/check-docs.test.ts scripts/docs-site/build.test.ts scripts/host-setup.test.ts scripts/install-sh.test.ts"

[tasks."docs:check"]
description = "Check that the operator docs and guides name only existing files, links, anchors, mise tasks, API endpoints, env vars and ports"
run = "bun scripts/check-docs.ts"

[tasks."docs:build"]
description = "Build the static documentation site from docs/ and docs/nav.json into dist/docs (or --out dir)"
run = "bun scripts/docs-site/build.ts build"
raw_args = true

[tasks."docs:serve"]
description = "Serve the documentation site on http://127.0.0.1:4321/ (or --port n), rebuilding when docs change"
run = "bun scripts/docs-site/build.ts serve"
raw_args = true

[tasks."test:db"]
description = "Run the DB-backed server tests (or the bun test arguments given) against a throwaway, migrated postgres:17.6 container that is always removed"
run = "bun --no-env-file scripts/test-db.ts"
raw_args = true

[tasks."test:ipv6-preflight"]
description = "Run FD-27 on isolated IPv4-only and dual-stack Docker networks with a disposable VPS, PostgreSQL and Pebble"
run = "mise run test:db scripts/ipv6-preflight-test/preflight.test.ts"

[tasks."test:ipv6-preflight-live"]
description = "Opt-in IPv6 preflight against a scratch VPS and HTTP-01 against Let's Encrypt staging"
run = "bun --no-env-file scripts/test-ipv6-preflight-live.ts"

[tasks."test:db:up"]
description = "Start and migrate a throwaway test PostgreSQL container and print shell exports plus an isolated ark_test_db test helper"
run = "bun --no-env-file scripts/test-db.ts up"

[tasks."test:db:down"]
description = "Remove a throwaway test PostgreSQL container started by test:db:up"
run = "bun --no-env-file scripts/test-db.ts down"
raw_args = true

[tasks."test:e2e"]
description = "Run fresh-volume browser onboarding against a disposable local database"
run = "bun --env-file=.env scripts/test-e2e.ts"

[tasks."test:e2e-gate"]
description = "Run the login gate end to end in Chromium (FD-11): the real API on a disposable database behind the containerised edge, with a fake upstream (requires Docker)"
run = "bun --env-file=.env scripts/test-e2e-gate.ts"

[tasks."test:upgrade"]
description = "Verify schema upgrade and startup nft policy activation (requires Docker)"
run = "bun --env-file=.env scripts/test-upgrade-migrations.ts"

[tasks."test:stalwart"]
description = "Run native mail lifecycle checks against a disposable pinned Stalwart container"
run = "env -u STALWART_URL -u STALWART_ADMIN_ADDRESS -u STALWART_ADMIN_PASSWORD bun scripts/test-stalwart-integration.ts"

[tasks."test:edge"]
description = "Check edge harness cleanup and pins, Caddy configurations, edge behaviour, public port nftables rules, LocalAPI deployment, route withdrawal, HAProxy SNI routing and TLS-TCP/raw-TCP routes (FD-14), the PostgreSQL router on 5432 with PgBouncer and postgres routes (FD-26), login gate routing, Origin contract, bypass guard and revocation (FD-11), concurrent HAProxy master-CLI reload safety, and HTTP route rate limits and HTTP mTLS on the custom Caddy build (FD-23)"
run = [
  "bun test scripts/edge-test scripts/edge-l4-guard.test.ts scripts/maintain.test.ts",
  "bun scripts/test-edge-config.ts",
  "bun scripts/test-db-ingress.ts",
  "bun scripts/test-edge-observer.ts",
  "bun scripts/test-edge-l4.ts",
  "bun scripts/test-edge-l4-routes.ts",
  "bun scripts/test-edge-pg5432.ts",
  "bun scripts/test-edge-gate.ts",
  "bun scripts/test-edge-reload-race.ts",
  "bun scripts/test-edge-http-controls.ts",
]

[tasks."test:edge-reload"]
description = "Race HAProxy master-CLI reloads (publisher, second reloader and the shipped launch guard under the shared reload lock; publications against an unlocked reloader) on the pinned edge-l4 image, and check that an invalid configuration still fails with the old worker serving (requires Docker)"
run = "bun scripts/test-edge-reload-race.ts"

[tasks."test:pgbouncer"]
description = "Start app-postgres and pgbouncer-public from the platform Compose file and test mTLS, SCRAM, admin-socket reloads, database clients (connect, read-only preview, revoke) and certificate rollover (two-CA overlap, emergency removal, retirement drain by not_after + 5 s; needs the migrated platform database)"
run = "bun scripts/test-pgbouncer-public.ts"

[tasks."test:db-ingress"]
description = "Check public port nftables rules, fail-closed recovery, counters and database ingress alerts in isolated network namespaces"
run = ["bun test shared/src/db-ingress.test.ts", "bun scripts/test-db-ingress.ts"]

[tasks."test:backups"]
description = "Off-VPS backups (FD-21) against a pinned MinIO, the actual postgres/app-postgres Compose services and a throwaway control database: append-only canary policy classes, the emulated R2 lock recipe, exact-config policy exceptions, Docker restore ownership, deployed-worker outage/file restores, and full PITR recovery of both clusters from the bucket alone (requires Docker)"
run = [
  "bunx tsc --noEmit -p scripts/tsconfig.backups.json",
  "bun test scripts/backup-test/provider-policies.test.ts scripts/offsite-restore.test.ts",
  "bun scripts/test-backups.ts",
]

[tasks."test:backups-tailnet"]
description = "Home-machine backups over the tailnet (FD-30): the shipped backup-ts service (offline tailscaled, userspace, SOCKS5), rest-server --append-only --private-repos on a simulated tailnet, MinIO and a throwaway control database: LocalAPI uid/write denial, pinning from backup-ts's own observation, REST through SOCKS5 only (S3/API unproxied), the canary and V-18, transfers stopped within 5 s on identity replacement, removal or lease expiry, and two-destination health (requires Docker)"
run = [
  "bunx tsc --noEmit -p scripts/tsconfig.backups.json",
  "bun test scripts/backup-test/tailnet-compose.test.ts",
  "bun scripts/test-backups-tailnet.ts",
]

[tasks."test:backups-tailnet-live"]
description = "Opt-in: a backup to a real home rest-server through backup-ts with only the tag:ark-backup -> home:8000 grant, and the live edge deny check; skips without ARK_TEST_TS_BACKUP_AUTHKEY and ARK_TEST_TS_HOME_AUTHKEY"
run = "bun scripts/test-backups-tailnet-live.ts"

[tasks."test:backups-hosted"]
description = "Opt-in: the same backup and off-VPS restore against AWS S3, B2 or R2 (virtual-host style); skips without ARK_TEST_S3_* credentials"
run = "bun scripts/test-backups-hosted.ts"

[tasks."test:tailnet-acl"]
description = "Validate the generated Tailscale policy snippet against a scratch tailnet (skips without ARK_TEST_TS_POLICY_API_KEY)"
run = "bun scripts/test-tailnet-acl.ts"

[tasks."test:agent"]
description = "Run Docker agent policy tests"
run = "go test ./..."
dir = "agent"

[tasks."test:agent-integration"]
description = "Deploy, inspect, restart, and remove a pinned workload on a disposable Docker project"
run = "ARK_DOCKER_INTEGRATION=1 go test -run TestDisposableDockerDeploymentAndDurableLedger -count=1 ./..."
dir = "agent"

[tasks.typecheck]
description = "Typecheck every TypeScript workspace, the image publisher, PgBouncer probes, the docs check and the docs site"
run = [
  "bunx tsc --noEmit -p shared/tsconfig.json",
  "bunx tsc --noEmit -p server/tsconfig.json",
  "bunx tsc --noEmit -p web/tsconfig.json",
  "bunx tsc --noEmit -p workers/tsconfig.json",
  "bunx tsc --noEmit -p scripts/tsconfig.publish.json",
  "bunx tsc --noEmit -p scripts/tsconfig.pgbouncer.json",
  "bunx tsc --noEmit -p scripts/tsconfig.test-db.json",
  "bunx tsc --noEmit -p scripts/tsconfig.backups.json",
  "bunx tsc --noEmit -p scripts/tsconfig.docs.json",
]

[tasks.lint]
description = "Lint the repository with oxlint"
run = "bunx oxlint ."

[tasks."lint:fix"]
description = "Apply safe oxlint fixes"
run = "bunx oxlint --fix ."

[tasks.format]
description = "Format the repository with oxfmt"
run = "bunx oxfmt ."

[tasks."format:check"]
description = "Check oxfmt formatting"
run = "bunx oxfmt --check ."

[tasks.check]
description = "Format, lint, typecheck, and test"
run = ["mise run format:check", "mise run lint", "mise run typecheck", "mise run test"]

[tasks."db:up"]
description = "Start the local platform PostgreSQL instance"
run = "docker compose -f infra/platform/docker-compose.yml -f infra/platform/docker-compose.dev.yml up -d postgres app-postgres"

[tasks."db:down"]
description = "Stop local platform containers"
run = "docker compose -f infra/platform/docker-compose.yml -f infra/platform/docker-compose.dev.yml down"

[tasks."db:generate"]
description = "Generate Drizzle migrations from the server schema"
run = "bun run --cwd server db:generate"
env = { _.file = ".env" }

[tasks."db:migrate"]
description = "Apply Drizzle migrations to PostgreSQL"
run = "bun run --cwd server db:migrate"
env = { _.file = ".env" }

[tasks."db:studio"]
description = "Open Drizzle Studio"
run = "bun run --cwd server db:studio"
env = { _.file = ".env" }

[tasks.recover]
description = "Local recovery CLI for lockout and setup repair"
raw_args = true
run = "bun run --cwd server recover"
env = { _.file = ".env" }

[tasks."recover:mfa"]
description = "Deliberately reset owner MFA and revoke every session"
raw_args = true
run = "bun --env-file=.env scripts/recover-mfa.ts"

[tasks."agent:test"]
description = "Run Go agent tests"
run = "go test ./..."
dir = "agent"

[tasks."images:publish"]
description = "Build every platform image and push it to GHCR"
raw_args = true
run = "bun scripts/publish-images.ts"

[tasks."images:pin-edge-caddy"]
description = "Pin the edge service and the sample release bundle to a published ark-edge-caddy digest (FD-23)"
raw_args = true
run = "bun scripts/pin-edge-caddy.ts"

[tasks."agent:build"]
description = "Build the Docker agent"
run = "go build -o ark-agent ."
dir = "agent"

[tasks.setup]
description = "Install tools and workspace dependencies"
run = ["mise install", "bun install"]

[tasks."host:install"]
description = "Install the platform, or prepare and harden the Ubuntu VPS with --enroll-vps and --harden-vps"
run = "bun scripts/install.ts"
env = { _.file = ".env" }
raw_args = true

[tasks."host:setup"]
description = "Guided production install on an Ubuntu VPS (run as root; started by install.sh): questions, Tailscale enrolment (manual keys or Tailscale API), SSH safety check, hardening and install, edge and optional backup node, admin origin and ACME, closing public SSH, provider firewall (manual or Hetzner Cloud API) and audit, summary"
run = "bun --no-env-file scripts/host-setup.ts"
raw_args = true

[tasks."host:audit"]
description = "Audit VPS listeners and published ports, export provider firewall rules or scan from off-host"
run = "bun scripts/host-audit.ts"
raw_args = true

[tasks."test:host-hardening"]
description = "Check FD-20 in isolated Docker containers with nftables, Stalwart and an external scanner"
run = "bun --no-env-file scripts/test-host-hardening.ts"

[tasks."test:host-hardening-live"]
description = "Opt-in scan and owner Tailscale SSH against a scratch VPS and scratch tailnet"
run = "bun --no-env-file scripts/test-host-hardening-live.ts"

[tasks."test:install-bootstrap"]
description = "Test bootstrap on supported Ubuntu releases, Docker conflict and repair paths, deployment lock contention, and scoped SSH recovery in disposable Linux containers"
run = "bun --no-env-file scripts/test-install-bootstrap.ts"

[tasks."test:install-live"]
description = "Opt-in: check the SSH gate, failed and successful cutovers, hardening and audit on a scratch VPS and tailnet, optionally with the Tailscale and Hetzner APIs (skips without ARK_TEST_INSTALL_* variables)"
run = "bun --no-env-file scripts/test-install-live.ts"

[tasks.import]
description = "Compare an Orkmail or PgStack inventory without importing owners"
raw_args = true
run = "bun --env-file=.env scripts/import.ts"

[tasks."recover-host"]
description = "Print the host-loss recovery checklist"
run = "bun --env-file=.env scripts/recover-host.ts"

[tasks."mail:up"]
description = "Start the Stalwart mail engine and ensure STARTTLS submission on TCP 587"
run = "bun scripts/install-mail-submission.ts"

[tasks."monitor:up"]
description = "Start Prometheus with 14-day retention"
run = "docker compose -f infra/monitoring/docker-compose.yml up -d"

[tasks.maintain]
description = "Validate and optionally apply a platform maintenance bundle"
raw_args = true
run = "bun --env-file=.env scripts/maintain.ts"

[tasks."edge:rejoin"]
description = "Recreate edge and edge-l4 if edge-ts was restarted or replaced under it"
run = "bun --env-file=.env scripts/edge-namespace.ts"

[tasks."test:edge-tailnet"]
description = "Opt-in: join edge-ts to a real test tailnet and check tags, grants, shields-up and UDP 41642 (skips without ARK_TEST_TS_EDGE_AUTHKEY)"
run = "bun scripts/test-edge-tailnet.ts"
