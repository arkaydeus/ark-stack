# Stalwart is the mail engine. Receiving and local accounts can start without SES.
# Outbound stays paused until relay credentials are verified.

[server.listener.smtp]
bind = ["0.0.0.0:25"]
protocol = "smtp"

[server.listener.submission]
bind = ["0.0.0.0:587"]
protocol = "smtp"

[server.listener.imaptls]
bind = ["0.0.0.0:993"]
protocol = "imap"

[authentication]
# Native admin routes stay on the private network only.

[session.relay]
# Unauthorized relaying is prohibited. Submission requires authenticated TLS.
