name: ark-mail

services:
  stalwart:
    image: stalwartlabs/stalwart@sha256:388dcb75a70727c5b551249a6d34b1f1321294852489e4fa3a4e6be698b7c4f0
    ports: ["25:25", "465:465", "587:587", "993:993"]
    expose: ["8080"]
    volumes:
      - ./config.json:/etc/stalwart/config.json:ro
      - ../../tmp/certs:/etc/stalwart/certs:ro
      - ark_mail_data:/var/lib/stalwart
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_ADMIN_ADDRESS:?generated by installer}:${STALWART_ADMIN_PASSWORD:?generated by installer}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [mail-public, mail-management]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The non-root image uses this one file capability for SMTP/IMAP ports.
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 256

volumes:
  ark_mail_data:

networks:
  mail-public: { enable_ipv6: true }
  mail-management:
    external: true
    name: ark_mail_management
