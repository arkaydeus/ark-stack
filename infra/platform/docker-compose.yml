name: ark-platform

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: ark-stack:${ARK_VERSION:-local}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
  pids_limit: 256

services:
  # Platform cluster. The image is the pinned postgres:17.6 digest plus pgBackRest, the backup executor
  # and WAL archiving into the encrypted local repo2 (Dockerfile `postgres-backup`, front door §3.18.1,
  # FD-21). Without a cipher pass archiving stays off and backup health reports it.
  postgres:
    image: ark-postgres:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: postgres-backup
    # Reaps the executor supervisor, which must never be a child of the postmaster.
    init: true
    environment:
      POSTGRES_USER: ark_migration
      POSTGRES_PASSWORD: ${ARK_CONTROL_DB_PASSWORD:?generated by installer}
      POSTGRES_DB: ark_platform
      ARK_API_DB_PASSWORD: ${ARK_API_DB_PASSWORD:?generated by installer}
      ARK_PG_STANZA: ark-platform
      ARK_PG_EXECUTOR_TOKEN: ${ARK_PLATFORM_PG_EXECUTOR_TOKEN:-}
      PGBACKREST_REPO2_CIPHER_PASS: ${ARK_PLATFORM_PG_REPO_CIPHER_PASS:-}
    volumes:
      - ark_platform_pg:/var/lib/postgresql/data
      - ./init-control-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
      # Persistent encrypted pgBackRest repo2 (expire-auto=n; never expired on the VPS) and the
      # staged read-only copies the backup worker exports.
      - ark_platform_pgbackrest:/var/lib/pgbackrest
      - ark_platform_pg_stages:/var/lib/pgbackrest-staging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ark_migration -d ark_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # The executor listens on 8432 on backup-management, which only the backup worker joins.
    networks: [control, backup-management]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The official entrypoint starts as root and drops to the postgres user via gosu, which
    # needs to change ownership of the data directory and switch uid/gid. With an empty
    # bounding set the container exits before PostgreSQL ever starts.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]

  # App cluster: the pinned pgvector image plus the same backup layer (Dockerfile `app-postgres-backup`).
  app-postgres:
    image: ark-app-postgres:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: app-postgres-backup
    init: true
    environment:
      POSTGRES_USER: ark_cluster_admin
      POSTGRES_PASSWORD: ${ARK_APP_DB_PASSWORD:?generated by installer}
      POSTGRES_DB: postgres
      ARK_PG_STANZA: ark-app
      ARK_PG_EXECUTOR_TOKEN: ${ARK_APP_PG_EXECUTOR_TOKEN:-}
      PGBACKREST_REPO2_CIPHER_PASS: ${ARK_APP_PG_REPO_CIPHER_PASS:-}
    volumes:
      - ark_app_pg:/var/lib/postgresql/data
      - ark_app_pgbackrest:/var/lib/pgbackrest
      - ark_app_pg_stages:/var/lib/pgbackrest-staging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ark_cluster_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [database-management, backup-management]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The official entrypoint starts as root and drops to the postgres user via gosu, which
    # needs to change ownership of the data directory and switch uid/gid. With an empty
    # bounding set the container exits before PostgreSQL ever starts.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]

  api:
    <<: *app
    command: [bun, run, --cwd, server, start]
    environment:
      ARK_EMBEDDED_WORKERS: "0"
      ARK_LISTEN_PORT: "3000"
      DATABASE_URL: postgres://ark_runtime:${ARK_API_DB_PASSWORD}@postgres:5432/ark_platform
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generated by installer}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?configured admin origin}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?configured browser origins}
      ARK_TRUSTED_PROXIES: ${ARK_TRUSTED_PROXIES:-172.16.0.0/12}
      ARK_ROOT_KEY: ${ARK_ROOT_KEY:?generated by installer}
      ARK_ROOT_KEY_ID: ${ARK_ROOT_KEY_ID:-k1}
      ARK_SETUP_TOKEN: ${ARK_SETUP_TOKEN:?generated by installer}
      ARK_INTERNAL_TOKEN: ${ARK_INTERNAL_TOKEN:?generated by installer}
      ARK_AGENT_TOKEN: ${ARK_AGENT_TOKEN:?generated by installer}
      ARK_DATABASE_WORKER_TOKEN: ${ARK_DATABASE_WORKER_TOKEN:?generated by installer}
      ARK_DOMAIN_WORKER_TOKEN: ${ARK_DOMAIN_WORKER_TOKEN:?generated by installer}
      ARK_MAIL_WORKER_TOKEN: ${ARK_MAIL_WORKER_TOKEN:?generated by installer}
      ARK_BACKUP_WORKER_TOKEN: ${ARK_BACKUP_WORKER_TOKEN:?generated by installer}
      ARK_MAINTENANCE_TOKEN: ${ARK_MAINTENANCE_TOKEN:?generated by installer}
      ARK_MFA_RECOVERY_TOKEN: ${ARK_MFA_RECOVERY_TOKEN:?generated by installer}
      ARK_METRICS_TOKEN: ${ARK_METRICS_TOKEN:?generated by installer}
      ARK_OFFHOST_HEARTBEAT_TOKEN: ${ARK_OFFHOST_HEARTBEAT_TOKEN:?generated by installer}
      ARK_OFFHOST_HEARTBEAT_URL: ${ARK_OFFHOST_HEARTBEAT_URL:-}
      ARK_DATABASE_WORKER_URL: http://database-worker:3101
      # The app image runs with a read-only root filesystem and only /tmp is writable, so the
      # approved-compose artefacts cannot default to a path under the working directory.
      ARK_COMPOSE_DIR: /tmp/ark-compose
      # nft drop counters written by database-ingress, exported on /api/metrics/prometheus
      # (docs/design/front-door.md §3.11, FD-18). Its own directory, so the API never sees the
      # PgBouncer userlist or TLS key.
      ARK_DB_INGRESS_METRICS_DIR: /var/lib/ark/db-ingress
      # Authenticates the edge watchdog's read-only lease reads (docs/design/front-door.md §3.2).
      # Without it the watchdog keeps every tailnet route withdrawn.
      ARK_EDGE_WATCHDOG_TOKEN: ${ARK_EDGE_WATCHDOG_TOKEN:-}
    # Never mount ark_edge_ts_socket here: the API has no access to tailscaled (front door §3.6).
    volumes: [../../tmp/db-ingress:/var/lib/ark/db-ingress:ro]
    expose: ["3000"]
    # Bootstrap and host-local recovery only; never bind the raw API publicly.
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [control, admin, monitoring]

  migrate:
    <<: *app
    command: [bun, run, --cwd, server, db:migrate]
    environment:
      DATABASE_URL: postgres://ark_migration:${ARK_CONTROL_DB_PASSWORD}@postgres:5432/ark_platform
    depends_on:
      postgres: { condition: service_healthy }
    networks: [control]
    restart: "no"

  database-worker:
    <<: *app
    image: ark-database-worker:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: database-worker
    command: [bun, run, --cwd, workers, database]
    environment:
      ARK_API_URL: http://api:3000
      ARK_RUNTIME_ROLE: worker
      ARK_WORKER_TOKEN: ${ARK_DATABASE_WORKER_TOKEN:?generated by installer}
      ARK_EMBEDDED_WORKERS: "0"
      DATABASE_URL: postgres://ark_runtime:${ARK_API_DB_PASSWORD}@postgres:5432/ark_platform
      DATABASE_APP_URL: postgres://ark_cluster_admin:${ARK_APP_DB_PASSWORD}@app-postgres:5432/postgres
      ARK_ROOT_KEY: ${ARK_ROOT_KEY:?generated by installer}
      ARK_ROOT_KEY_ID: ${ARK_ROOT_KEY_ID:-k1}
      ARK_STATE_DIR: /var/lib/ark
      ARK_PGBOUNCER_DIR: /var/lib/ark/pgbouncer
      # FD-16: PgBouncer is reloaded with RELOAD on its admin console over the shared unix
      # socket. This worker has no Docker CLI and no Docker socket.
      ARK_PGBOUNCER_RELOAD: "1"
      ARK_PGBOUNCER_SOCKET_DIR: /var/run/pgbouncer
      ARK_PGBOUNCER_ADMIN_PASSWORD: ${ARK_PGBOUNCER_ADMIN_PASSWORD:?generated by installer}
      ARK_PGBOUNCER_TLS_HOST: pgbouncer-public
      ARK_DATABASE_CANCEL_PORT: "3101"
    volumes:
      - ../../tmp/pgbouncer:/var/lib/ark/pgbouncer
      - ark_pgbouncer_socket:/var/run/pgbouncer
    depends_on:
      api: { condition: service_started }
      app-postgres: { condition: service_healthy }
    networks: [control, database-management]
    expose: ["3101"]

  domain-worker:
    <<: *app
    image: ark-domain-worker:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: domain-worker
    command: [bun, run, --cwd, workers, domains]
    environment:
      ARK_API_URL: http://api:3000
      ARK_RUNTIME_ROLE: worker
      ARK_WORKER_TOKEN: ${ARK_DOMAIN_WORKER_TOKEN:?generated by installer}
      ARK_EMBEDDED_WORKERS: "0"
      DATABASE_URL: postgres://ark_runtime:${ARK_API_DB_PASSWORD}@postgres:5432/ark_platform
      ARK_ROOT_KEY: ${ARK_ROOT_KEY:?generated by installer}
      ARK_ROOT_KEY_ID: ${ARK_ROOT_KEY_ID:-k1}
      ARK_CERT_DIR: /var/lib/ark/certs
      ARK_EDGE_DIR: /var/lib/ark/edge
      ARK_ACME_WEBROOT: /var/lib/ark/acme
      ARK_EDGE_RELOAD_URL: http://edge-admin:2019
      ARK_LEGO_BIN: /usr/local/bin/lego
      ARK_ACME_EMAIL: ${ARK_ACME_EMAIL:-}
      ARK_ACME_STAGING: ${ARK_ACME_STAGING:-1}
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # edge.observe reads the edge node's LocalAPI status through this socket (front door §3.6).
      ARK_EDGE_TS_SOCKET: /var/run/tailscale/tailscaled.sock
      # edge.l4_apply (front door §3.8.6, FD-25): writes immutable generations, has the restricted
      # validator check them, swaps `current` and reloads edge-l4 through the master CLI. The worker
      # reaches these sockets through the shared group 4400 only; it has no Docker access.
      ARK_EDGE_L4_DIR: /usr/local/etc/haproxy
      ARK_HAPROXY_VALIDATOR_SOCKET: /var/run/haproxy-validator/validate.sock
      ARK_HAPROXY_MASTER_SOCKET: /var/run/haproxy/master.sock
      ARK_HAPROXY_ADMIN_SOCKET: /var/run/haproxy/admin.sock
    group_add: ["4400"]
    volumes:
      - ../../tmp/certs:/var/lib/ark/certs
      - ../../tmp/edge:/var/lib/ark/edge
      - ../../tmp/acme:/var/lib/ark/acme
      # Generations are written as bun:4400, directories 2750 and files 0640 (installer-initialised).
      - ../../tmp/edge-l4:/usr/local/etc/haproxy
      - ark_haproxy_validator_run:/var/run/haproxy-validator
      - ark_haproxy_run:/var/run/haproxy
      # Read-only, and the worker runs as the non-root `bun` user: tailscaled grants it read access
      # only (status, whois, dial), and refuses every state-changing endpoint with 403. Shown by
      # the FD-06 deployment test in `mise run test:edge`; no observer sidecar is needed.
      - ark_edge_ts_socket:/var/run/tailscale:ro
    depends_on: [api]
    networks: [control, admin, edge-control]

  mail-worker:
    <<: *app
    image: ark-mail-worker:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mail-worker
    command: [bun, run, --cwd, workers, mail]
    environment:
      ARK_API_URL: http://api:3000
      ARK_RUNTIME_ROLE: worker
      ARK_WORKER_TOKEN: ${ARK_MAIL_WORKER_TOKEN:?generated by installer}
      ARK_EMBEDDED_WORKERS: "0"
      DATABASE_URL: postgres://ark_runtime:${ARK_API_DB_PASSWORD}@postgres:5432/ark_platform
      ARK_ROOT_KEY: ${ARK_ROOT_KEY:?generated by installer}
      ARK_ROOT_KEY_ID: ${ARK_ROOT_KEY_ID:-k1}
      ARK_MAIL_STATE_DIR: /var/lib/ark/mail-state
      STALWART_URL: ${STALWART_URL:-http://stalwart:8080}
      STALWART_ADMIN_ADDRESS: ${STALWART_ADMIN_ADDRESS:-admin}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:?generated by installer}
      STALWART_CLI: ${STALWART_CLI:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      SES_SMTP_USERNAME: ${SES_SMTP_USERNAME:-}
    volumes: [../../tmp/mail-state:/var/lib/ark/mail-state]
    depends_on: [api]
    networks: [control, mail-management]

  backup-worker:
    <<: *app
    image: ark-backup-worker:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: backup-worker
    command: [bun, run, --cwd, workers, backup]
    environment:
      ARK_API_URL: http://api:3000
      ARK_RUNTIME_ROLE: worker
      ARK_WORKER_TOKEN: ${ARK_BACKUP_WORKER_TOKEN:?generated by installer}
      ARK_EMBEDDED_WORKERS: "0"
      DATABASE_URL: postgres://ark_runtime:${ARK_API_DB_PASSWORD}@postgres:5432/ark_platform
      ARK_ROOT_KEY: ${ARK_ROOT_KEY:?generated by installer}
      ARK_ROOT_KEY_ID: ${ARK_ROOT_KEY_ID:-k1}
      ARK_BACKUP_EXECUTE: ${ARK_BACKUP_EXECUTE:-0}
      ARK_BACKUP_REQUIRED: ${ARK_BACKUP_REQUIRED:-0}
      ARK_RESTORE_RUNNER: ${ARK_RESTORE_RUNNER:-0}
      ARK_RESTIC_BIN: ${ARK_RESTIC_BIN:-}
      # FD-21: the PostgreSQL executors (fixed actions, per-cluster tokens) and their staged copies.
      # Off-VPS targets, credentials and the restic repository password are configured in Ark and
      # sealed; restic receives them only in its own subprocess environment.
      ARK_PLATFORM_PG_EXECUTOR_URL: http://postgres:8432
      ARK_PLATFORM_PG_EXECUTOR_TOKEN: ${ARK_PLATFORM_PG_EXECUTOR_TOKEN:-}
      ARK_APP_PG_EXECUTOR_URL: http://app-postgres:8432
      ARK_APP_PG_EXECUTOR_TOKEN: ${ARK_APP_PG_EXECUTOR_TOKEN:-}
      ARK_PG_STAGE_ROOT: /var/lib/ark/pg-stages
      ARK_RESTIC_CACHE_DIR: /var/lib/ark/backups/restic-cache
    # Staged pgBackRest copies are postgres:postgres (999) 0640/0750; the worker reads them through
    # the group, read-only. It never mounts the live repo2 or PGDATA.
    group_add: ["999"]
    volumes:
      - ../../tmp/backups:/var/lib/ark/backups
      - ../../tmp/restore-runs:/var/lib/ark/restore-runs
      - ark_platform_pg_stages:/var/lib/ark/pg-stages/ark-platform:ro
      - ark_app_pg_stages:/var/lib/ark/pg-stages/ark-app:ro
    depends_on: [api]
    # backup-egress reaches the S3-compatible target; backup-management reaches the executors only.
    networks: [control, backup-management, backup-egress]

  agent:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    image: ark-agent:${ARK_VERSION:-local}
    environment:
      ARK_API_URL: http://api:3000
      ARK_AGENT_TOKEN: ${ARK_AGENT_TOKEN:?generated by installer}
      ARK_AGENT_STATE_DIR: /var/lib/ark-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ark_agent_state:/var/lib/ark-agent
    depends_on: [api]
    restart: unless-stopped
    networks: [control]
    security_opt: [no-new-privileges:true]
    pids_limit: 128

  pgbouncer-public:
    # PgBouncer 1.26.1 (multi-arch index digest). Releases before 1.25.2 are affected by
    # CVE-2026-6664, an unauthenticated crash on a malformed SCRAM packet.
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    # Run PgBouncer directly on Ark's generated config. The image's /entrypoint.sh builds a
    # config from DB_HOST/DATABASE_URL env vars and exits when they are unset.
    entrypoint: [/usr/bin/pgbouncer]
    command: [/var/lib/ark/pgbouncer/pgbouncer.ini]
    # Ark writes the config, userlist and TLS key as uid 1000 with mode 0600 (the installer
    # chowns tmp/pgbouncer and tmp/certs to it). With every capability dropped, the image's
    # default postgres user (uid 70) could not read them.
    user: "1000:1000"
    # TCP-only probe: a pg_isready login attempt would log a failed "no such user" login on
    # every interval and pollute failed-login monitoring.
    healthcheck:
      test: [CMD, nc, -z, -w, "3", 127.0.0.1, "5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Loopback only. The host-namespace ingress binds 5432 after nftables is installed.
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - ../../tmp/pgbouncer:/var/lib/ark/pgbouncer:ro
      - ../../tmp/certs:/var/lib/ark/certs:ro
      # Admin console socket, shared only with database-worker (§3.10.2).
      - ark_pgbouncer_socket:/var/run/pgbouncer
    depends_on:
      app-postgres: { condition: service_healthy }
    restart: unless-stopped
    # A non-internal bridge is required for Docker to publish the host loopback port.
    # Backends remain exclusively on the isolated database-management bridge.
    networks: [database-management, database-loopback]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  database-ingress:
    <<: *app
    image: ark-database-ingress:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: database-ingress
    command: [bun, run, --cwd, scripts, database-ingress.ts]
    network_mode: host
    # nft needs NET_ADMIN as root across exec. DAC_OVERRIDE permits this writer to read
    # the 0600 policy and write snapshots in the installer-owned (1000:1000) directories.
    # The API still sees only the dedicated read-only metrics mount.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_OVERRIDE]
    environment:
      ARK_PGBOUNCER_DIR: /var/lib/ark/pgbouncer
      ARK_PGBOUNCER_LOOPBACK_PORT: "15432"
      ARK_PUBLIC_DB_PORT: "5432"
      ARK_DB_INGRESS_METRICS_DIR: /var/lib/ark/db-ingress
    volumes:
      - ../../tmp/pgbouncer:/var/lib/ark/pgbouncer
      - ../../tmp/db-ingress:/var/lib/ark/db-ingress
    depends_on: [pgbouncer-public]
    restart: unless-stopped
    pids_limit: 64

  # The public edge's own Tailscale node (tag:ark-edge), separate from the admin `tailscale` node
  # below. It owns the network namespace that `edge` joins, so it publishes the edge's ports and
  # carries the `edge-admin` alias (docs/design/front-door.md §3.6, §3.16). Kernel mode puts
  # `tailscale0` in this namespace, so the proxies dial tailnet addresses natively.
  edge-ts:
    image: tailscale/tailscale:v1.86.2@sha256:241d9518b7e0b6e533dbd0117fcea15acb4174249210837f52b71615949ce9d2
    hostname: ark-edge
    environment:
      TS_USERSPACE: "false"
      # A one-off, pre-approved key for tag:ark-edge (docs/operating.md, "Edge Tailscale node").
      # Without it the node waits for login and the edge still serves.
      TS_AUTHKEY: ${TS_EDGE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      # Keep Docker's resolver so `api` and `edge-admin` resolve; MagicDNS is never needed here.
      TS_ACCEPT_DNS: "false"
      # No inbound tailnet connections to the edge node, whatever the tailnet policy allows.
      TS_EXTRA_ARGS: "--shields-up"
      # The host tailscaled keeps the default 41641.
      TS_TAILSCALED_EXTRA_ARGS: "--port=41642"
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_drop: [ALL]
    # NET_ADMIN creates tailscale0, routes and rules. NET_RAW is needed by the image's iptables
    # (legacy backend), which tailscaled runs for its netfilter rules; without it every call fails
    # with "can't initialize iptables table: Permission denied" (checked by `mise run test:edge`).
    # Capabilities are per process: Caddy in this namespace still runs with none.
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80" # Caddy: ACME HTTP-01 and HTTPS redirects
      - "443:443" # edge-l4: HAProxy SNI router in front of Caddy (127.0.0.1:8443)
      - "41642:41642/udp" # direct WireGuard paths for the edge node
    volumes:
      - ark_edge_ts_state:/var/lib/tailscale
      # tailscaled's LocalAPI socket, shared read-only with domain-worker only (FD-06).
      - ark_edge_ts_socket:/var/run/tailscale
    networks:
      admin: {}
      # Caddy binds its admin API to this alias, so the unauthenticated config endpoint is only
      # reachable from the internal edge-control network. Nothing on `admin` — including the API
      # process and the tailnet containers — can rewrite public routing.
      edge-control:
        aliases: [edge-admin]
    restart: unless-stopped

  edge:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    # Ark writes the Caddyfile and every certificate key as uid 1000 with mode 0600 (the installer
    # chowns tmp/edge and tmp/certs to it). As root with every capability dropped, Caddy could not
    # read them and would exit at startup. The image's /data/caddy and /config/caddy are 1777.
    user: "1000:1000"
    # Ports, networks and the edge-admin alias belong to edge-ts. A restarted or recreated edge-ts
    # leaves this container in a dead namespace until it is recreated: `mise run maintain` and
    # `mise run edge:rejoin` do that (docs/operating.md, "Edge Tailscale node"). Caddy serves :80
    # publicly; its HTTPS sites listen on 127.0.0.1:8443 only, behind edge-l4 with PROXY v2 (FD-25).
    network_mode: service:edge-ts
    # The launch guard asks edge-watchdog whether the lease allows every tailnet route in the
    # Caddyfile, and otherwise starts the official binary from Caddyfile.closed (front door §3.2).
    entrypoint: [/bin/sh, /usr/local/bin/ark-edge-launch-guard]
    environment:
      ARK_EDGE_CONFIG_DIR: /etc/caddy/ark
      ARK_EDGE_WATCHDOG_URL: http://edge-watchdog:2021
    volumes:
      - ../../tmp/acme:/var/lib/ark/acme:ro
      # Ark-issued lego certificates, loaded per site with `tls` (docs/design/front-door.md §3.14).
      - ../../tmp/certs:/var/lib/ark/certs:ro
      # Caddyfile and Caddyfile.closed, written by the domain worker. A directory mount, so a
      # renamed (atomically replaced) file is what a restart reads.
      - ../../tmp/edge:/etc/caddy/ark:ro
      - ./edge-launch-guard.sh:/usr/local/bin/ark-edge-launch-guard:ro
      - ark_edge_data:/data
    # Start order only: without the watchdog the guard starts closed rather than not at all.
    depends_on: [edge-ts, api, edge-watchdog]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Edge-local lease watchdog (docs/design/front-door.md §3.2, FD-06). Every second it reads the
  # read-only lease endpoint and withdraws tailnet backends the lease no longer allows from the
  # running Caddy through the admin API; if that fails it stops Caddy and raises an alert. It works
  # with the operation workers stopped. No database credential, root key, Docker or tailscaled socket.
  edge-watchdog:
    <<: *app
    image: ark-edge-watchdog:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: edge-watchdog
    command: [bun, run, --cwd, workers, edge-watchdog]
    environment:
      ARK_API_URL: http://api:3000
      ARK_EDGE_WATCHDOG_TOKEN: ${ARK_EDGE_WATCHDOG_TOKEN:-}
      ARK_EDGE_ADMIN_URL: http://edge-admin:2019
      ARK_EDGE_DIR: /var/lib/ark/edge
      ARK_EDGE_WATCHDOG_PORT: "2021"
      # HAProxy withdrawal (FD-25): master CLI across current and leaving workers, and the generations
      # the edge-l4 launch guard asks about.
      ARK_EDGE_L4_DIR: /usr/local/etc/haproxy
      ARK_HAPROXY_MASTER_SOCKET: /var/run/haproxy/master.sock
    group_add: ["4400"]
    volumes:
      - ../../tmp/edge:/var/lib/ark/edge:ro
      - ../../tmp/edge-l4:/usr/local/etc/haproxy:ro
      - ark_haproxy_run:/var/run/haproxy
    expose: ["2021"]
    depends_on: [api]
    networks: [control, edge-control]

  # HAProxy SNI router on 443 (docs/design/front-door.md §3.8, FD-25). It owns public 443 in the edge-ts
  # namespace and sends HTTP, admin and login hostnames (and unknown SNI) to Caddy on 127.0.0.1:8443
  # with PROXY v2; non-TLS is rejected after 5 s. The launch guard asks the edge watchdog before
  # serving any tailnet backend and supervises HAProxy while one exists (front door §3.2).
  edge-l4:
    image: haproxy:3.2.26-alpine@sha256:1c3568e520453cc8ba98c39501febcf450429c80e6cc27ecad779961d76e597c
    # Binds 443 as the image's uid 99 with no capabilities: Docker sets ip_unprivileged_port_start=0 in
    # the namespace. Recreated with edge by `mise run edge:rejoin` when edge-ts is replaced.
    network_mode: service:edge-ts
    # Runs `haproxy -W -db -S /var/run/haproxy/master.sock,gid,4400,mode,660 -f <guard link>`, where the
    # link points at current/haproxy.cfg or, without a valid lease, current/haproxy.closed.cfg.
    entrypoint: [/bin/sh, /usr/local/bin/ark-edge-l4-launch-guard]
    group_add: ["4400"]
    environment:
      ARK_EDGE_L4_DIR: /usr/local/etc/haproxy
      ARK_EDGE_WATCHDOG_URL: http://edge-watchdog:2021
      ARK_HAPROXY_MASTER_SOCKET: /var/run/haproxy/master.sock
    volumes:
      # Immutable generations and the `current` symlink, written by the domain worker.
      - ../../tmp/edge-l4:/usr/local/etc/haproxy:ro
      - ./edge-l4-launch-guard.sh:/usr/local/bin/ark-edge-l4-launch-guard:ro
      # Master and admin sockets (0660, group 4400), shared with domain-worker and edge-watchdog.
      - ark_haproxy_run:/var/run/haproxy
    tmpfs: ["/run/ark-l4:rw,noexec,nosuid,nodev,size=64k,uid=99,gid=99,mode=0700"]
    depends_on: [edge-ts, edge-watchdog]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # Restricted HAProxy validator (docs/design/front-door.md §3.8.6, FD-25): the edge-l4 image digest plus
  # a socket daemon that runs only `haproxy -c -f <root>/generations/<id>/haproxy.cfg` for a hashed
  # generation ID. No network, no Docker, read-only configuration at the same absolute path.
  haproxy-validator:
    image: ark-haproxy-validator:${ARK_VERSION:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: haproxy-validator
    network_mode: none
    group_add: ["4400"]
    environment:
      ARK_EDGE_L4_DIR: /usr/local/etc/haproxy
      ARK_HAPROXY_VALIDATOR_SOCKET: /var/run/haproxy-validator/validate.sock
    volumes:
      - ../../tmp/edge-l4:/usr/local/etc/haproxy:ro
      - ark_haproxy_validator_run:/var/run/haproxy-validator
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.86.2@sha256:241d9518b7e0b6e533dbd0117fcea15acb4174249210837f52b71615949ce9d2
    profiles: [tailnet]
    hostname: ark-stack-admin
    environment:
      TS_USERSPACE: "true"
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ark_tailscale_state:/var/lib/tailscale
      - ../../tmp/edge:/config:ro
    restart: unless-stopped
    networks: [admin]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  tailnet-gateway:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    profiles: [tailnet]
    network_mode: service:tailscale
    volumes: [./TailnetCaddyfile:/etc/caddy/Caddyfile:ro]
    depends_on: [tailscale, api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  ark_platform_pg:
  ark_app_pg:
  # FD-21: per-cluster encrypted pgBackRest repo2 and staged copies (front door §3.18.1).
  ark_platform_pgbackrest:
  ark_platform_pg_stages:
  ark_app_pgbackrest:
  ark_app_pg_stages:
  ark_agent_state:
  ark_edge_data:
  ark_edge_ts_state:
  # tailscaled's LocalAPI socket: read-write in edge-ts, read-only in domain-worker, nowhere else.
  ark_edge_ts_socket:
  ark_tailscale_state:
  # PgBouncer's admin console socket directory. A tmpfs owned by uid 1000 (PgBouncer and the
  # database worker), mode 0700, mounted only into pgbouncer-public and database-worker.
  ark_pgbouncer_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700,size=1m
  # edge-l4 master and admin sockets (front door §3.8.6): owned by HAProxy's uid 99 and the shared group
  # 4400, setgid so the sockets inherit the group. Mounted into edge-l4, domain-worker and edge-watchdog.
  ark_haproxy_run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=99,gid=4400,mode=2770,size=1m
  # The validator's socket directory, shared only with domain-worker.
  ark_haproxy_validator_run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=99,gid=4400,mode=2770,size=1m

networks:
  control: { internal: true }
  admin: {}
  edge-control: { internal: true }
  database-management: { internal: true }
  database-loopback: {}
  # FD-21: backup worker <-> PostgreSQL executors (port 8432), internal only.
  backup-management: { internal: true }
  # FD-21: backup worker -> S3-compatible targets (internet).
  backup-egress: {}
  mail-management:
    external: true
    name: ark_mail_management
  monitoring:
    external: true
    name: ark_monitoring
