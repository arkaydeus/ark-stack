groups:
  - name: ark-stack
    rules:
      - alert: ArkApiDown
        expr: up{job="ark-stack"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ark Stack API scrape is down
      - alert: HostNeedsExternalHeartbeat
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: On-host Prometheus cannot report complete host loss. Configure ARK_ALERT_WEBHOOK off-box.
