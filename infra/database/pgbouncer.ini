[databases]
; Public mappings are generated per admitted database. Do not use '*'.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
pool_mode = transaction
ignore_startup_parameters = extra_float_digits
client_tls_sslmode = require
max_client_conn = 200
default_pool_size = 20
admin_users =
