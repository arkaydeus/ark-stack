name: GHCR publish check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: docker/setup-buildx-action@v4
      - run: bun scripts/check-image-plan.ts
      - name: Verify GHCR publishing with a disposable package
        run: bun scripts/test-ghcr-publish.ts
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
